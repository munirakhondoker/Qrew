<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qrew — Multi-Tenant Access Control Platform</title>
  <meta name="description" content="Enterprise multi-tenant management and hierarchical access-control platform.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header" id="sidebar-header">
        <div class="brand-wrapper" id="brand-wrapper" title="Go to Platform Landing Page">
          <div class="brand-logo" id="sidebar-brand-logo">Q</div>
          <div class="brand-info" id="sidebar-brand-info">
            <span class="brand-name" id="sidebar-brand-name">Qrew</span>
            <span class="brand-badge" id="sidebar-brand-badge">Platform Level</span>
          </div>
        </div>
        <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="Collapse sidebar (Ctrl+B)" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" x2="20" y1="6" y2="6"/>
            <line x1="4" x2="20" y1="12" y2="12"/>
            <line x1="4" x2="20" y1="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Context Selector (Tenant or Office Switcher) -->
      <div class="sidebar-context-picker" id="sidebar-context-picker" style="display:none;">
        <span class="sidebar-context-label" id="sidebar-context-label">Select Tenant</span>
        <select class="sidebar-context-select" id="sidebar-context-select" aria-label="Switch organization or branch"></select>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Dynamically rendered based on active workspace: Platform, Tenant Workspace, Office Workspace -->
      </nav>

      <div class="sidebar-footer">
        <div class="system-status">
          <span class="status-indicator"></span>
          <span>Mesh Active</span>
        </div>
        <div style="font-size:11px;font-family:var(--font-mono);color:var(--color-text-muted);">v1.0-mvp</div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Navigation Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open sidebar menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
        </div>

        <div class="topbar-center" id="topbar-center">
          <div class="topbar-domain-badge">
            <span class="topbar-domain-dot"></span>
            <span id="topbar-domain-text">app.qrew.com/admin</span>
          </div>
        </div>

        <div class="topbar-right">
          <div class="topbar-actions">
            <!-- Notifications Trigger -->
            <button class="icon-btn" id="notifications-trigger" title="Recent Activity Notifications" aria-label="Notifications">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
              <span class="notification-badge"></span>
            </button>

            <!-- Notifications Popover -->
            <div class="notifications-popover" id="notifications-popover">
              <div class="notifications-header">
                <span class="notifications-title">System Activities</span>
                <span style="font-size:11px;color:var(--color-text-muted);">Recent Events</span>
              </div>
              <div class="notifications-list" id="notifications-list"></div>
            </div>
          </div>

          <!-- User Profile Trigger & Menu -->
          <div class="user-profile-menu">
            <button class="user-profile-trigger" id="user-profile-trigger" aria-haspopup="true">
              <div class="user-avatar" id="topbar-user-avatar">S</div>
              <div class="user-meta">
                <span class="user-name" id="topbar-user-name">Sakib</span>
                <span class="user-role-tag" id="topbar-user-role">Platform Admin</span>
              </div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-text-muted);"><polyline points="6 9 12 15 18 9"/></svg>
            </button>

            <!-- User Dropdown Menu -->
            <div class="dropdown-menu" id="user-dropdown-menu">
              <div class="dropdown-header" id="dropdown-header-btn" style="cursor:pointer;" title="Click to edit profile">
                <div class="dropdown-user-title" id="dropdown-user-title">Sakib</div>
                <div class="dropdown-user-email" id="dropdown-user-email">sakib@qrew.io</div>
                <div class="dropdown-user-role" id="dropdown-user-role" style="font-size:11px;color:var(--panel-accent, var(--color-accent));font-weight:600;margin-top:2px;">Platform Admin</div>
              </div>
              <div class="dropdown-item" id="action-my-profile">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                My Profile
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Dynamic Content Container -->
      <main class="content-area" id="main-content" role="main">
        <!-- Rendered by js/app.js -->
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/components.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
